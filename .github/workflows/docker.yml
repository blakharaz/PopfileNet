name: Docker Build and Push

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      backend_tag: ${{ steps.meta.outputs.tags }}
      ui_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push UI Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ui
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-ui:${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  generate-release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: dotnet tool install -g aspire.cli --prerelease

      - name: Add Docker integration
        working-directory: PopfileNet.AppHost
        run: dotnet add package Aspire.Hosting.Docker

      - name: Enable Docker Compose environment
        run: |
          cat > PopfileNet.AppHost/AppHost.cs << 'EOF'
var builder = DistributedApplication.CreateBuilder(args);

builder.AddDockerComposeEnvironment("popfilenet");

var postgres = builder.AddPostgres("postgres")
    .WithDataVolume();

var backend = builder.AddProject<Projects.PopfileNet_Backend>("popfilenet-backend")
    .WithReference(postgres);

builder.AddProject<Projects.PopfileNet_Ui>("popfilenet-ui")
    .WithReference(backend);

builder.Build().Run();
EOF

      - name: Generate deployment files
        working-directory: PopfileNet.AppHost
        run: |
          dotnet restore
          mkdir -p aspire-output
          aspire publish -o aspire-output

      - name: Remove dashboard from compose
        run: |
          # Remove dashboard service and related config
          sed -i '/popfilenet-dashboard:/,/restart: "always"/d' PopfileNet.AppHost/aspire-output/docker-compose.yaml
          # Also remove any OTEL references from services
          sed -i '/OTEL_EXPORTER_OTLP_ENDPOINT/d' PopfileNet.AppHost/aspire-output/docker-compose.yaml
          sed -i '/OTEL_EXPORTER_OTLP_PROTOCOL/d' PopfileNet.AppHost/aspire-output/docker-compose.yaml
          sed -i '/OTEL_SERVICE_NAME/d' PopfileNet.AppHost/aspire-output/docker-compose.yaml
          sed -i '/OTEL_DOTNET_EXPERIMENTAL/d' PopfileNet.AppHost/aspire-output/docker-compose.yaml

      - name: Update .env with image tags
        run: |
          TAG="${{ needs.build-and-push.outputs.backend_tag }}"
          
          # Extract just the tag (take first line which is the semver tag)
          IMAGE_TAG=$(echo "$TAG" | head -1)
          
          # Update .env with image tags
          sed -i "s|POPFILENET_BACKEND_IMAGE=.*|POPFILENET_BACKEND_IMAGE=ghcr.io/${{ env.IMAGE_NAME }}-backend:${IMAGE_TAG}|" PopfileNet.AppHost/aspire-output/.env
          sed -i "s|POPFILENET_UI_IMAGE=.*|POPFILENET_UI_IMAGE=ghcr.io/${{ env.IMAGE_NAME }}-ui:${IMAGE_TAG}|" PopfileNet.AppHost/aspire-output/.env
          sed -i "s|POPFILENET_BACKEND_PORT=.*|POPFILENET_BACKEND_PORT=5000|" PopfileNet.AppHost/aspire-output/.env
          sed -i "s|POPFILENET_UI_PORT=.*|POPFILENET_UI_PORT=5001|" PopfileNet.AppHost/aspire-output/.env
          sed -i "s|POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=|" PopfileNet.AppHost/aspire-output/.env

      - name: Create Release
        uses: softprops/action-gh-release-asset@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: PopfileNet Release ${{ github.ref }}
          files: |
            PopfileNet.AppHost/aspire-output/docker-compose.yaml
            PopfileNet.AppHost/aspire-output/.env

      - name: Restore AppHost.cs
        run: |
          cat > PopfileNet.AppHost/AppHost.cs << 'EOF'
var builder = DistributedApplication.CreateBuilder(args);

var postgres = builder.AddPostgres("postgres")
    .WithDataVolume();

var backend = builder.AddProject<Projects.PopfileNet_Backend>("popfilenet-backend")
    .WithReference(postgres);

builder.AddProject<Projects.PopfileNet_Ui>("popfilenet-ui")
    .WithReference(backend);

builder.Build().Run();
EOF